name: Xpeet
options:
  bundleIdPrefix: app.plouton
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Xpeet:
    type: application
    platform: iOS
    sources: [Xpeet]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plouton.xpeet
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Xpeet
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Xpeet uses your location only to show your current speed. It never leaves your device."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  XpeetTests:
    type: bundle.unit-test
    platform: iOS
    sources: [XpeetTests]
    dependencies:
      - target: Xpeet
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Xpeet:
    build:
      targets:
        Xpeet: all
        XpeetTests: [test]
    test:
      targets: [XpeetTests]
